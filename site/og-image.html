<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f1eee7; --fg:#232323; --muted:#5b5a56; --border:#e3ddd0; --gold:#d6a878; }
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:var(--bg);color:var(--fg);
    font-family:"Inter",sans-serif;padding:76px 84px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between}
  /* faint knowledge-graph motif, top-right */
  .motif{position:absolute;inset:0;pointer-events:none}
  .name{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:96px;
    letter-spacing:-.02em;line-height:1}
  .head{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:40px;
    color:var(--fg);margin-top:26px;letter-spacing:-.01em}
  .blurb{font-size:27px;color:var(--muted);margin-top:14px;max-width:44ch;line-height:1.45}
  .rule{width:64px;height:4px;background:var(--gold);border-radius:2px;margin-top:34px}
  .foot{display:flex;align-items:center;gap:22px;font-family:"JetBrains Mono",monospace;
    font-size:22px;color:var(--muted)}
  .foot .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .foot .url{color:var(--fg);font-weight:500}
  .tags{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .tag{font-family:"JetBrains Mono",monospace;font-size:20px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:8px 18px;background:#fff}
</style>
</head>
<body>
  <svg class="motif" viewBox="0 0 1200 630" fill="none">
    <g stroke="#d8d2c4" stroke-width="1.5" opacity=".9">
      <line x1="1010" y1="120" x2="1120" y2="70"/>
      <line x1="1010" y1="120" x2="1090" y2="215"/>
      <line x1="1010" y1="120" x2="905" y2="175"/>
      <line x1="1090" y1="215" x2="1150" y2="300"/>
      <line x1="905" y1="175" x2="880" y2="285"/>
    </g>
    <g fill="#c9c1af">
      <circle cx="1010" cy="120" r="13"/>
      <circle cx="1120" cy="70" r="7"/>
      <circle cx="1090" cy="215" r="9"/>
      <circle cx="905" cy="175" r="8"/>
      <circle cx="1150" cy="300" r="6"/>
      <circle cx="880" cy="285" r="6"/>
    </g>
    <circle cx="1010" cy="120" r="13" fill="#d6a878"/>
  </svg>

  <div>
    <div class="name">Yuan-Hsuan Wen</div>
    <div class="head">Software engineer, self-studying<br>CS &amp; AI in public</div>
    <div class="rule"></div>
    <div class="tags">
      <span class="tag">LeetCode write-ups</span>
      <span class="tag">CS224n / NLP notes</span>
      <span class="tag">System design</span>
    </div>
  </div>

  <div class="foot">
    <span class="dot"></span><span class="url">yuan-hsuan.github.io</span>
    <span>·</span><span>466 solved · CS &amp; AI, in the open</span>
  </div>
</body>
</html>
