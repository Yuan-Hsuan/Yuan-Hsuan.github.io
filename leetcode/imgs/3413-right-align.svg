<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" role="img" aria-label="右端對齊的視窗索引"><defs><marker id="p" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M1,1 L6,4 L1,7" fill="none" stroke="#7a5aa6" stroke-width="1.7"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M1,1 L6,4 L1,7" fill="none" stroke="#a9781a" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="640" height="228" rx="10" fill="#fbf8f1" stroke="#ddd3c1"/><text x="24" y="28" fill="#26221b" font-size="14" text-anchor="start" font-family="Georgia,serif" font-weight="700">右端對齊：窗 = [r−k+1, r]，最左段凸出去的砍掉</text><line x1="228" y1="42" x2="228" y2="176" stroke="#c9524a" stroke-width="2" stroke-dasharray="3 4"/><line x1="504" y1="42" x2="504" y2="176" stroke="#c9524a" stroke-width="2"/><rect x="90" y="60" width="322" height="30" rx="5" fill="#dfeacd" stroke="#4f7a4a"/><text x="251" y="79" fill="#4f7a4a" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">段 [a, b]，每格 c 幣</text><rect x="90" y="60" width="138" height="30" rx="5" fill="#c9524a" opacity="0.28"/><line x1="90" y1="52" x2="228" y2="52" stroke="#c9524a" stroke-width="1.6" marker-start="url(#p)" marker-end="url(#p)" stroke-dasharray="0"/><text x="159" y="49" fill="#c9524a" font-size="10.5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">砍：W−a 格</text><rect x="228" y="102" width="276" height="34" rx="6" fill="#d7e3ee" stroke="#3f6b93" stroke-width="1.6"/><text x="366" y="123" fill="#3f6b93" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">窗 = [ r−k+1 , r ]</text><line x1="228" y1="148" x2="504" y2="148" stroke="#3f6b93" stroke-width="1.6" marker-start="url(#p)" marker-end="url(#p)"/><text x="366" y="162" fill="#3f6b93" font-size="10.5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">k 格（= r − (r−k+1) + 1）</text><text x="67" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">1</text><text x="113" y="182" fill="#4f7a4a" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">2</text><text x="159" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">3</text><text x="205" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">4</text><text x="251" y="182" fill="#c9524a" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">5</text><text x="297" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">6</text><text x="343" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">7</text><text x="389" y="182" fill="#4f7a4a" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">8</text><text x="435" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">9</text><text x="481" y="182" fill="#c9524a" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">10</text><text x="527" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">11</text><text x="573" y="182" fill="#6f6656" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">12</text><text x="228" y="40" fill="#c9524a" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">W = r−k+1（窗左端）</text><text x="504" y="40" fill="#c9524a" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">r（窗右端＝某段右界）</text><text x="24" y="208" fill="#26221b" font-size="11.5" text-anchor="start" font-family="ui-monospace,Menlo,monospace">窗內拿到 = curr(段全值) − (W − a)×c  ｜  一切長度都是 右−左+1</text></svg>